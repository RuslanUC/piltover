[system]
# Path to data directory where systtem data will be stored
data_dir = "data"
# Database connection string
database_connection_string = "sqlite://data/secrets/piltover.db"

# NATS address to use for sending rpc requests and other system internal messages between gateway and workers.
#nats_address = "nats://127.0.0.1:4222"

# Whether to run everything (gateway, session layer, workers and scheduler) in a single process.
single_process = true

# Whether to enable @system bot. When enabled, it responds to /info command with instance info
#  (name, versions, some non-critical config options).
enable_system_bot = false

# Where all cached data (users, chats, messages, etc.) will be stored
[system.cache]
# Cache backend. Available backends: "memory", "redis", "memcached", "none".
#  - "memory" - keeps cache in Python dict, not persistent between restarts.
#  - "redis", "memcached" - keeps cache in Redis/Memcached, requires it to be installed and running, persistent between restarts.
#  - "none" - disable caching completely.
backend = "memory"
# Cache endpoint. Only for "redis" and "memcached" cache types.
#endpoint = "127.0.0.1"
# Cache port. Only for "redis" and "memcached" cache types.
#port = 6379
# Cache database number. Only for "redis" cache type.
#db = "0"

# Debug tracing.
[system.debug_tracing]
# Tracing backend. Available backends: console, zipkin, noop.
backend = "noop"
# Zipkin address where to send all traces.
#zipkin_address = "http://127.0.0.1:9411/api/v2/spans"

# Integration with official Telegram
[system.telegram_integration]
# Whether integration is enabled.
# Currently used only for authorization (receiving Piltover codes in Telegram).
# Note that you will be able to run bot when this option is disabled.
enabled = false
# Token of the bot used for integration.
#bot_token = "123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11"
# How many accounts a single Telegram used may create. Set to 0 or any negative number to disable new registrations.
#max_accounts_per_user = 3
# How phone number for Piltover account is chosen.
#  - "real" - user must share phone number with the bot, that phone number will be used.
#             setting `max_accounts_per_user` option to anything greater than 1 makes no sense when this policy is chosen.
#  - "random" - generate random phone number in "+999XXXXXXX" format.
#  - "user-provided" - user phovides phone number.
#phone_number_policy = "random"
